log_level = "INFO"

[run]
dataset_root = "data/public_dataset_a/public_dataset_upload"
questions_subdir = "questions/group_a"
raw_docs_subdir = "raw"
split = "A"
output_csv = "outputs/answer.csv"
output_evidence_jsonl = ""

[llm]
base_url = "https://llm-xur4gfd4busltusy.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
model = "qwen-plus"
api_key_env = "DASHSCOPE_API_KEY"
timeout_seconds = 120.0
max_retries = 2

[retrieval]
chunk_max_chars = 300
per_hit_max_chars = 300
bm25_synonyms_per_feature = 3
enable_grep_retrieval = true
grep_terms_per_query = 16
grep_context_window = 120
doc_top_k = 3
per_doc_top_k = 5
per_option_top_k = 5
top_k_chunks = 12
coarse_doc_window_chars = 2400
refine_context_chars = 12000
max_context_chars = 9000
max_routing_rounds = 2
enable_domain_supplement = false
truncate_hit_content_for_context = false
enable_agentic_rag = false
agentic_max_iterations = 2
agentic_enable_context_refine = false
agentic_enable_judge = false
agentic_min_hits_per_option = 1
